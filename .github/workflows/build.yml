
name: Build Soren Tools V1 APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q SorenToolsV1-CloudBuild.zip -d source

      - name: Build APK
        working-directory: source/SorenToolsV1
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SorenToolsV1-APK
          path: source/SorenToolsV1/app/build/outputs/apk/debug/app-debug.apk
